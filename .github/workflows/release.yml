name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the manifest
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the README status
        run: node scripts/check-readme-status.mjs
      - name: Leak check
        env:
          LEAKCHECK_DENYLIST: ${{ secrets.LEAKCHECK_DENYLIST }}
        run: npm run leak-check -- --history --require-denylist
      - name: Stage the release assets
        run: node scripts/stage-release.mjs "$RUNNER_TEMP/assets"
      - name: Extract the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/assets/main.js" \
            "$RUNNER_TEMP/assets/manifest.json" \
            "$RUNNER_TEMP/assets/styles.css" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            $flags
