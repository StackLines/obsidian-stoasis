<svg xmlns="http://www.w3.org/2000/svg" width="1998" height="700" viewBox="0 0 1998 700">
<defs>
  <linearGradient id="scrim" x1="0" x2="1"><stop offset="0" stop-color="#070a12" stop-opacity=".92"/><stop offset=".54" stop-color="#0d1422" stop-opacity=".48"/><stop offset="1" stop-color="#070a12" stop-opacity="0"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7e6ff" stop-opacity=".10"/><stop offset=".28" stop-color="#121b2d" stop-opacity=".38"/><stop offset="1" stop-color="#070a12" stop-opacity=".12"/></linearGradient>
  <linearGradient id="titleInk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".58" stop-color="#e7f5ff"/><stop offset="1" stop-color="#a9d9f5"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#63d9ff"/><stop offset=".7" stop-color="#8f9cff"/><stop offset="1" stop-color="#e8b96a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  <style>
    .title { font-family: DejaVu Sans, sans-serif; font-weight: 700; letter-spacing: .055em; fill: url(#titleInk); }
    .eyebrow { font-family: DejaVu Sans Mono, monospace; letter-spacing: .13em; fill: #cfeeff; }
    .tagline { font-family: DejaVu Sans, sans-serif; letter-spacing: .02em; fill: #d9e8f2; }
  </style>
</defs>
<rect width="1165" height="700" fill="url(#scrim)"/>
<rect x="46" y="42" width="690" height="346" rx="30" fill="#63d9ff" opacity=".045" filter="url(#shadow)"/>
<rect x="76" y="64" width="344" height="40" rx="20" fill="url(#glass)" stroke="#b7e6ff" stroke-opacity=".32"/>
<circle cx="96" cy="84" r="4" fill="#63d9ff"/>
<text x="112" y="90" class="eyebrow" font-size="14">OPEN-SOURCE OBSIDIAN PLUGIN</text>
<text x="76" y="252" class="title" font-size="138">Stoasis</text>
<line x1="76" y1="276" x2="390" y2="276" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
<circle cx="408" cy="276" r="5" fill="#e8b96a"/>
<text x="76" y="312" class="tagline" font-size="27">A shared oasis for your notes.</text>
<line x1="76" y1="356" x2="628" y2="356" stroke="#b7e6ff" stroke-opacity=".18"/>
</svg>
